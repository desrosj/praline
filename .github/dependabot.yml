version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # A Composer update that changes the bundled code also needs vendor-prefixed/
  # rebuilt (composer prefix); the "Bundled code matches composer.lock" check fails
  # until it is.
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
