name: Bundled Code

on:
  push:
    branches:
      - main
    paths:
      - 'composer.*'
      - 'bin/mark-modified.php'
      - 'vendor-prefixed/**'
      - '.github/workflows/bundled-code.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'composer.*'
      - 'bin/mark-modified.php'
      - 'vendor-prefixed/**'
      - '.github/workflows/bundled-code.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  # vendor-prefixed/ is built from composer.lock by Strauss and committed. Build it
  # again and check that nothing but the build's own date and commit lines differ,
  # so a Composer change (a Dependabot update, say) can't land without it.
  bundled:
    name: Bundled code matches composer.lock
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 5
    env:
      # A pull request is checked out as a merge commit on no branch, which
      # Composer would record as the root package's version, dev-<commit>.
      COMPOSER_ROOT_VERSION: dev-main

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none

      # With scripts: post-install-cmd runs Strauss and bin/mark-modified.php.
      - name: Install Composer dependencies and rebuild vendor-prefixed/
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Check vendor-prefixed/ is unchanged
        run: |
          # Ignored: the date in the modification notices, the root commit Composer
          # records (NULL with COMPOSER_ROOT_VERSION), and the package numbers in
          # installed.json.
          git diff --exit-code \
            -I 'Modified by Praline on [0-9-]+:' \
            -I "'reference' => ('[0-9a-f]*'|NULL)," \
            -I '^ +"[0-9]+": \{$' \
            -- vendor-prefixed
          untracked="$(git ls-files --others --exclude-standard -- vendor-prefixed)"
          if [ -n "$untracked" ]; then
            echo "New files in vendor-prefixed/:"
            echo "$untracked"
            exit 1
          fi
