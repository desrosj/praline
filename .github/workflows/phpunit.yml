name: PHPUnit Tests

on:
  push:
    branches:
      - main
    paths:
      - '**.php'
      - 'composer.*'
      - 'phpunit.xml.dist'
      - 'bin/install-wp-tests.sh'
      - 'tests/**'
      - 'vendor-prefixed/**'
      - '.github/workflows/phpunit.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**.php'
      - 'composer.*'
      - 'phpunit.xml.dist'
      - 'bin/install-wp-tests.sh'
      - 'tests/**'
      - 'vendor-prefixed/**'
      - '.github/workflows/phpunit.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  # The PHPUnit integration tests, against the WordPress test suite, on every
  # supported PHP version with the latest WordPress release and with nightly
  # (trunk), and on the oldest supported PHP version with the oldest supported
  # WordPress ("Requires at least").
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, WordPress ${{ matrix.wp }})
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4', '8.5', '8.6' ]
        wp: [ 'latest', 'nightly' ]
        include:
          - php: '8.2'
            wp: '6.5'
    services:
      database:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wordpress_tests
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # --no-scripts: test the committed vendor-prefixed/, not a fresh Strauss build.
      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: '--no-scripts'

      - name: Install WordPress and the test suite
        run: bash bin/install-wp-tests.sh wordpress_tests root root 127.0.0.1 "$WP_VERSION" true
        env:
          WP_VERSION: ${{ matrix.wp }}

      - name: Run PHPUnit
        run: composer test
