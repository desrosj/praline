##
# A workflow that runs Praline's PHPUnit integration tests against the WordPress test suite.
#
# Every supported PHP version is tested against the latest WordPress release and against
# nightly (trunk), and the oldest supported PHP version is also tested against the oldest
# supported WordPress version ("Requires at least").
##
name: PHPUnit Tests

on:
  push:
    branches:
      - main
    paths:
      # Only run when changes are made to the plugin's code, its tests, or their configuration.
      - '**.php'
      - 'composer.*'
      - 'phpunit.xml.dist'
      - 'bin/install-wp-tests.sh'
      - 'tests/**'
      - 'vendor-prefixed/**'
      - '.github/workflows/phpunit.yml'
  pull_request:
    branches:
      - main
    paths:
      # Only run when changes are made to the plugin's code, its tests, or their configuration.
      - '**.php'
      - 'composer.*'
      - 'phpunit.xml.dist'
      - 'bin/install-wp-tests.sh'
      - 'tests/**'
      - 'vendor-prefixed/**'
      - '.github/workflows/phpunit.yml'
  workflow_dispatch:

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name for pull requests
  # or the commit hash for any other events.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  # Runs the PHPUnit tests.
  #
  # A MySQL 8.4 service holds the test database. The plugin is tested with its committed
  # `vendor-prefixed/` directory, not a fresh Strauss build.
  #
  # Performs the following steps:
  # - Checks out the repository.
  # - Sets up PHP.
  # - Installs Composer dependencies (without running scripts, so `vendor-prefixed/` is left as committed).
  # - Installs WordPress and the WordPress test suite.
  # - Runs the PHPUnit tests.
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, WordPress ${{ matrix.wp }})
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4', '8.5', '8.6' ]
        wp: [ 'latest', 'nightly' ]
        include:
          - php: '8.2'
            wp: '6.5'
    services:
      database:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wordpress_tests
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # --no-scripts: test the committed vendor-prefixed/, not a fresh Strauss build.
      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: '--no-scripts'

      - name: Install WordPress and the test suite
        run: bash bin/install-wp-tests.sh wordpress_tests root root 127.0.0.1 "$WP_VERSION" true
        env:
          WP_VERSION: ${{ matrix.wp }}

      - name: Run PHPUnit
        run: composer test
