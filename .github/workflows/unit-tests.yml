name: Unit Tests

on:
  push:
    branches:
      - main
    paths:
      - '**.php'
      - 'composer.*'
      - 'phpunit.xml.dist'
      - 'bin/**'
      - 'tests/**'
      - 'vendor-prefixed/**'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**.php'
      - 'composer.*'
      - 'phpunit.xml.dist'
      - 'bin/**'
      - 'tests/**'
      - 'vendor-prefixed/**'
      - '.github/workflows/unit-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  # The PHPUnit integration tests, against the WordPress test suite, on every
  # supported PHP version with the latest WordPress, and on the oldest supported
  # PHP version with the oldest supported WordPress ("Requires at least").
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, WordPress ${{ matrix.wp }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4', '8.5', '8.6' ]
        wp: [ 'latest' ]
        include:
          - php: '8.2'
            wp: '6.5'
    services:
      database:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wordpress_tests
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # --no-scripts: test the committed vendor-prefixed/, not a fresh Strauss build.
      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: '--no-scripts'

      - name: Install WordPress and the test suite
        run: bash bin/install-wp-tests.sh wordpress_tests root root 127.0.0.1 "$WP_VERSION" true
        env:
          WP_VERSION: ${{ matrix.wp }}

      - name: Run PHPUnit
        run: composer test

  # tests/e2e/run.sh: a real WordPress served by PHP's built-in server, asked for
  # pages the way BonBon asks. Once with Praline's bundled Markdown Alternate, and
  # once with the standalone Markdown Alternate plugin active alongside it.
  e2e:
    name: End-to-end (PHP ${{ matrix.php }}, ${{ matrix.markdown-alternate }} Markdown Alternate)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.6' ]
        markdown-alternate: [ 'bundled', 'standalone' ]
    services:
      database:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # The plugin runs from its committed vendor-prefixed/, so no Composer install.
      - name: Install WordPress
        run: bash bin/install-wp-tests.sh praline_e2e root root 127.0.0.1 latest true
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Put the plugin in WordPress
        run: |
          echo "PLUGINS_DIR=$RUNNER_TEMP/wordpress/wp-content/plugins" >> "$GITHUB_ENV"
          PLUGINS_DIR="$RUNNER_TEMP/wordpress/wp-content/plugins"
          mkdir -p "$PLUGINS_DIR/praline"
          rsync -a --exclude .git ./ "$PLUGINS_DIR/praline/"

      - name: Install the standalone Markdown Alternate
        if: ${{ matrix.markdown-alternate == 'standalone' }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/markdown-alternate.zip" "$MARKDOWN_ALTERNATE_URL"
          echo "$MARKDOWN_ALTERNATE_SHA256  $RUNNER_TEMP/markdown-alternate.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/markdown-alternate.zip" -d "$PLUGINS_DIR"
        env:
          MARKDOWN_ALTERNATE_URL: https://github.com/ProgressPlanner/markdown-alternate/releases/download/v1.2.0/markdown-alternate-1.2.0.zip
          # From the release's SHA256SUMS.txt.
          MARKDOWN_ALTERNATE_SHA256: 210a23b9ac1067043682a73ec35d63237499a9960df228e1b1380db9675a1c71

      - name: Run the end-to-end checks
        working-directory: ${{ runner.temp }}/wordpress/wp-content/plugins/praline
        run: tests/e2e/run.sh
        env:
          E2E_DB_PASSWORD: root
          E2E_WITH_MARKDOWN_ALTERNATE: ${{ matrix.markdown-alternate == 'standalone' && '1' || '' }}
          TMPDIR: ${{ runner.temp }}

      - name: Show PHP's debug log
        if: ${{ failure() }}
        run: cat "$RUNNER_TEMP/praline-e2e-debug.log" || true

  # vendor-prefixed/ is built from composer.lock by Strauss and committed. Build it
  # again and check that nothing but the build's own date and commit lines differ,
  # so a Composer change (a Dependabot update, say) can't land without it.
  bundled:
    name: Bundled code matches composer.lock
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none

      # With scripts: post-install-cmd runs Strauss and bin/mark-modified.php.
      - name: Install Composer dependencies and rebuild vendor-prefixed/
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Check vendor-prefixed/ is unchanged
        run: |
          # Ignored: the date in the modification notices, the commit Composer
          # records, and the package numbers in installed.json.
          git diff --exit-code \
            -I 'Modified by Praline on [0-9-]+:' \
            -I "'reference' => '[0-9a-f]*'," \
            -I '^ +"[0-9]+": \{$' \
            -- vendor-prefixed
          untracked="$(git ls-files --others --exclude-standard -- vendor-prefixed)"
          if [ -n "$untracked" ]; then
            echo "New files in vendor-prefixed/:"
            echo "$untracked"
            exit 1
          fi
